spring.application.name=auth-service
server.port=8082

spring.datasource.url=${SMARTLOGIX_AUTH_DB_URL:jdbc:postgresql://localhost:5433/smartlogix_auth}
spring.datasource.username=${SMARTLOGIX_AUTH_DB_USERNAME:smartlogix}
spring.datasource.password=${SMARTLOGIX_AUTH_DB_PASSWORD:smartlogix123}

spring.jpa.hibernate.ddl-auto=update
spring.jpa.open-in-view=false
spring.jpa.show-sql=true

management.endpoints.web.exposure.include=health,info

security.jwt.secret=${SMARTLOGIX_JWT_SECRET:smartlogix-development-secret-key-change-me-2026}
security.jwt.expiration-seconds=${SMARTLOGIX_JWT_EXPIRATION_SECONDS:3600}

springdoc.api-docs.path=/api-docs
springdoc.swagger-ui.path=/swagger-ui.html
