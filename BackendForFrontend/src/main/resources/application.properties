spring.application.name=BackendForFrontend
server.port=${PORT:8080}

app.cors.allowed-origins=${CORS_ALLOWED_ORIGINS:http://localhost:5173,http://localhost:4173}

management.endpoints.web.exposure.include=health,info

security.jwt.secret=${SMARTLOGIX_JWT_SECRET:smartlogix-development-secret-key-change-me-2026}
security.jwt.expiration-seconds=${SMARTLOGIX_JWT_EXPIRATION_SECONDS:3600}

smartlogix.services.inventory-url=${INVENTORY_SERVICE_URL:http://localhost:8081}
smartlogix.services.auth-url=${AUTH_SERVICE_URL:http://localhost:8082}
