services:
  postgres:
    image: postgres:16-alpine
    container_name: smartlogix-postgres
    environment:
      POSTGRES_DB: smartlogix_inventory
      POSTGRES_USER: smartlogix
      POSTGRES_PASSWORD: smartlogix123
    ports:
      - "5432:5432"
    volumes:
      - smartlogix-postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U smartlogix -d smartlogix_inventory"]
      interval: 10s
      timeout: 5s
      retries: 5

  auth-postgres:
    image: postgres:16-alpine
    container_name: smartlogix-auth-postgres
    environment:
      POSTGRES_DB: smartlogix_auth
      POSTGRES_USER: smartlogix
      POSTGRES_PASSWORD: smartlogix123
    ports:
      - "5433:5432"
    volumes:
      - smartlogix-auth-postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U smartlogix -d smartlogix_auth"]
      interval: 10s
      timeout: 5s
      retries: 5

  auth-service:
    build:
      context: ./auth-service
    container_name: smartlogix-auth-service
    depends_on:
      auth-postgres:
        condition: service_healthy
    environment:
      SMARTLOGIX_AUTH_DB_URL: jdbc:postgresql://auth-postgres:5432/smartlogix_auth
      SMARTLOGIX_AUTH_DB_USERNAME: smartlogix
      SMARTLOGIX_AUTH_DB_PASSWORD: smartlogix123
      SMARTLOGIX_JWT_SECRET: smartlogix-development-secret-key-change-me-2026
    ports:
      - "8082:8082"

  inventory-service:
    build:
      context: ./inventory-service
    container_name: smartlogix-inventory-service
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      SMARTLOGIX_DB_URL: jdbc:postgresql://postgres:5432/smartlogix_inventory
      SMARTLOGIX_DB_USERNAME: smartlogix
      SMARTLOGIX_DB_PASSWORD: smartlogix123
      SMARTLOGIX_JWT_SECRET: smartlogix-development-secret-key-change-me-2026
    ports:
      - "8081:8081"

  bff:
    build:
      context: ./BackendForFrontend
    container_name: smartlogix-bff
    depends_on:
      - auth-service
      - inventory-service
    environment:
      SMARTLOGIX_JWT_SECRET: smartlogix-development-secret-key-change-me-2026
      AUTH_SERVICE_URL: http://auth-service:8082
      INVENTORY_SERVICE_URL: http://inventory-service:8081
    ports:
      - "8080:8080"

volumes:
  smartlogix-postgres-data:
  smartlogix-auth-postgres-data:
